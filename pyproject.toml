[project]
name = "energy-futures"
version = "0.1.0"
description = "Uncertainty-aware forecasting and risk-aware flexibility planning for Great Britain's electricity system (research prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_futures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
