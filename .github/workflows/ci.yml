# Continuous integration: install the exact locked environment and run the test suite on every
# push and pull request. Data-dependent tests skip automatically (raw data is not in the repo and
# must be downloaded with `uv run python -m energy_futures.pipeline download`).
#
# ubuntu-latest is the required job: a failure there marks the run as failed.
# macos-latest is best-effort (continue-on-error: true) with a 30-minute timeout so a
# GitHub macOS runner shortage cannot block the green tick.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
            timeout_minutes: 20
          - os: macos-latest
            experimental: true
            timeout_minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install libomp (LightGBM on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --locked
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Run tests
        run: uv run --locked pytest -q
